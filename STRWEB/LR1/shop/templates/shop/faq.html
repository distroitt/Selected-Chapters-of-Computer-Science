{% extends "shop/base.html" %}
{% block title %}Словарь{% endblock %}
{% block content %}
<h1>Словарь терминов и понятий</h1>
{% for item in items %}
  <details class="section">
    <summary>{{ item.question }} <small>— {{ item.created_at|date:"d/m/Y" }}</small></summary>
    <p>{{ item.answer }}</p>
  </details>
{% empty %}
  <p>Записи пока не добавлены.</p>
{% endfor %}
{% endblock %}
