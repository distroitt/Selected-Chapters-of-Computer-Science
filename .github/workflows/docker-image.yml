name: Docker Image CI

on:
  push:
    branches:
      - STRWEB_LR1
  pull_request:
    branches:
      - STRWEB_LR1

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: STRWEB/LR1/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r STRWEB/LR1/requirements.txt

      - name: Check Django configuration
        working-directory: STRWEB/LR1
        run: python manage.py check

      - name: Check migrations
        working-directory: STRWEB/LR1
        run: python manage.py makemigrations --check --dry-run

      - name: Run tests
        working-directory: STRWEB/LR1
        run: pytest

  build:
    runs-on: ubuntu-latest
    needs: test
    timeout-minutes: 20

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish Docker image
        uses: docker/build-push-action@v6
        with:
          context: ./STRWEB/LR1
          file: ./STRWEB/LR1/Dockerfile
          push: ${{ github.event_name == 'push' }}
          tags: |
            ghcr.io/${{ github.repository_owner }}/strweb-lr1:latest
            ghcr.io/${{ github.repository_owner }}/strweb-lr1:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
