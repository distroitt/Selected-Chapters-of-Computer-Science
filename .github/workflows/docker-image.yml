name: Docker Image CI

on:
  push:
    branches: [ "STRWEB_LR3" ]
  pull_request:
    branches: [ "STRWEB_LR3" ]
jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          
      - name: Create logs directory
        working-directory: STRWEB/LR3
        run: mkdir -p logs

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r STRWEB/LR3/requirements.txt

      - name: Run tests
        working-directory: STRWEB/LR3
        run: pytest

  build:
    runs-on: ubuntu-latest
    needs: test

    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

      - name: Build the Docker image
        run: |
          docker build STRWEB/LR3 \
            --file STRWEB/LR3/Dockerfile \
            --tag ghcr.io/${{ github.repository_owner }}/strweb-lr3:latest \
            --tag ghcr.io/${{ github.repository_owner }}/strweb-lr3:${{ github.sha }}
            
      - name: Push the Docker image
        run: |
          docker push ghcr.io/${{ github.repository_owner }}/strweb-lr3:latest
          docker push ghcr.io/${{ github.repository_owner }}/strweb-lr3:${{ github.sha }}
