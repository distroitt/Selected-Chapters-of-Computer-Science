name: Docker Image CI

on:
  push:
    branches: [ "IGI_LR5" ]
  pull_request:
    branches: [ "IGI_LR5" ]

jobs:

  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: Build the Docker image
      run: docker build IGI/LR5/ --file IGI/LR5/Dockerfile --tag igi-lr5:$(date +%s)
