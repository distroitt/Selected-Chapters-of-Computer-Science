name: Docker Image CI

on:
  push:
    branches: [ "IGI_LR5" ]
  pull_request:
    branches: [ "IGI_LR5" ]
jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          
      - name: Create logs directory
        working-directory: IGI/LR5
        run: mkdir -p logs

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r IGI/LR5/requirements.txt

      - name: Run tests
        working-directory: IGI/LR5
        run: pytest

  build:
    runs-on: ubuntu-latest
    needs: test

    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

      - name: Build the Docker image
        run: |
          docker build IGI/LR5/ \
            --file IGI/LR5/Dockerfile \
            --tag ghcr.io/${{ github.repository_owner }}/igi-lr5:latest \
            --tag ghcr.io/${{ github.repository_owner }}/igi-lr5:${{ github.sha }}
