name: Docker Image CI

on:
  push:
    branches: [ "IGI_LR5" ]
  pull_request:
    branches: [ "IGI_LR5" ]
jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

      - name: Build the Docker image
        run: |
          docker build IGI/LR5/ \
            --file IGI/LR5/Dockerfile \
            --tag ghcr.io/${{ github.repository_owner }}/igi-lr5:latest \
            --tag ghcr.io/${{ github.repository_owner }}/igi-lr5:${{ github.sha }}

      - name: Push the Docker image
        run: |
          docker push ghcr.io/${{ github.repository_owner }}/igi-lr5:latest
          docker push ghcr.io/${{ github.repository_owner }}/igi-lr5:${{ github.sha }}
